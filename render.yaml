services:
  - type: web
    name: wowmazing-market-agent-api
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: RESEARCH_GATEWAY_KEY
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: "upstox"

      - key: ALLOW_YFINANCE_FALLBACK
        value: "true"

      - key: OPENAI_MODEL
        value: "gpt-5.6-luna"

      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false